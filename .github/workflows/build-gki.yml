name: Build NX729J GKI (Red Magic 8S Pro)

# 红魔 8S Pro (NX729S/NX729J, SM8550/kalama, GKI 2.0)
# 支持多内核版本构建（workflow_dispatch 选择 kernel_version）：
#   - 5.15.41  : nubia 官方 5.15.41 树 (main 分支)，clang-14 (r450784d)
#   - 5.15.167 : Qualcomm kernel.lnx.5.15.c5 重建树 (nx729j-5.15.167 分支)
#   - 5.15.104 : ACK 5.15.104 重建树 (nx729j-5.15.104 分支)，单文件 nx729j_defconfig
#   - 5.15.144 : ACK 5.15.144 重建树 (nx729j-5.15.144 分支)，单文件 nx729j_defconfig
# 功能开关：enable_* 对应已发布 release 的功能行，关闭后从 .config 移除对应符号
#           (依赖项由 olddefconfig 自动清理)
# 内核版本串：默认四个版本一律由 git 派生 (5.15.x-g<提交号>)，凭 uname -r 就能认出这次
#           构建对应的提交。要与手机固件串逐字一致时(如 OTA 后固件串变了但内核 SUBLEVEL
#           没变)用 custom_version 填完整串，workflow 剥掉版本号前缀写进 .scmversion。
#           ★ 必须带内核版本号前缀：只写后缀会拼出 "5.15.104%s" 这种串，末尾的校验会判失败。
# 自动发布：构建成功默认自动创建 GitHub Release (create_release 关闭可跳过)
# 两套配置机制（由 CONFIG_MODE 区分）：
#   merge  : 5.15.41 / 5.15.167 —— merge_config.sh 三合一生成 vendor/kalama-NX729J-gki_defconfig；
#            检入的那份是 stock 合并产物，必须先重新生成，否则我们的改动进不了 .config
#   single : 5.15.104 / 5.15.144 —— 直接 make nx729j_defconfig（这两个分支树内没有 vendor/ 片段）
# 关于 LTO：绝不关闭 LTO。关掉 LTO 会连带关掉 CFI_CLANG，module_layout 等符号 CRC 与手机
#           固件不符 -> 内核无法开机。改为编译前硬校验 LTO/CFI/MODVERSIONS，不符即中止。
#           代价是 FullLTO 链接内存峰值较高，需 public 仓库的 4 核/16GB runner 才跑得动。

env:
  TZ: Asia/Shanghai
  CLANG_VER: r450784d

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本'
        required: true
        type: choice
        options:
          - 5.15.41
          - 5.15.104
          - 5.15.144
          - 5.15.167
      ccache_update:
        description: '更新ccache缓存(源码/配置变更后开启)'
        required: true
        type: boolean
        default: 'false'
      package_ak3:
        description: '打包 AnyKernel3 刷机包(卡刷/内核管理器刷入)'
        required: true
        type: boolean
        default: 'true'
      custom_version:
        description: '自定义完整版本串(留空用默认)。系统 OTA 更新后固件版本串变化但内核版本号没变时，用它对齐 vendor_dlkm vermagic。获取完整版本串: 手机 adb shell cat /proc/version，取含 Linux version 那一行的第一个空格段，或直接复制已发布 Release 的内核版本号。示例: 5.15.167-android13-8-00020-g1a2b3c4d5e6f-g9876543210'
        required: false
        type: string
        default: ''
      enable_susfs:
        description: 'SUSFS 支持(内核级隐藏 root)'
        required: true
        type: boolean
        default: 'true'
      enable_lz4:
        description: 'ZRAM LZ4 压缩算法'
        required: true
        type: boolean
        default: 'true'
      enable_network:
        description: '网络增强(ipset + IPv6 NAT，OpenClash 等依赖)'
        required: true
        type: boolean
        default: 'true'
      enable_bbbrutal:
        description: 'BBR/Brutal 拥塞控制算法'
        required: true
        type: boolean
        default: 'true'
      enable_droidspaces:
        description: 'Droidspaces 容器支持(SYSVIPC/命名空间)'
        required: true
        type: boolean
        default: 'true'
      enable_bbg:
        description: '内核级基带保护(防格机)'
        required: true
        type: boolean
        default: 'true'
      enable_ebpf:
        description: 'eBPF 支持(BPF/JIT/BTF/IKHEADERS，daed 必需)'
        required: true
        type: boolean
        default: 'true'
      create_release:
        description: '构建成功自动发布 GitHub Release'
        required: true
        type: boolean
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: write
      contents: write
    steps:
      - name: 设置版本参数
        id: ver
        run: |
          set -e
          # 每个内核版本：分支 / 配置机制 / 版本串 / ccache 键 / release 基底说明
          #   CONFIG_MODE=merge  -> merge_config.sh 三合一生成 vendor/kalama-NX729J-gki_defconfig
          #   CONFIG_MODE=single -> 直接 make arch/arm64/configs/nx729j_defconfig
          case "${{ inputs.kernel_version }}" in
            5.15.167)
              BRANCH="nx729j-5.15.167"; CONFIG_MODE="merge"; KALAMA_CFG="kalama_le_GKI.config"
              VERSION_TAG="5.15.167"; CCACHE_KEY="nx729j-gki-5.15.167"
              VER_PREFIX="5.15.167"
              # 不再钉死固件版本串：与 104/144 一样走 git 派生(5.15.167-g<提交号>)，
              # 这样两次不同构建(如换 KSU 版本)能凭 uname -r 区分开。
              # 想还原成固件串就把 custom_version 填上(后面要带 -ab... 那一段)：
              #   5.15.167-android13-8-00017-gb1f32b310a30-ab12826353
              # 钉子只有 .scmversion 一个来源，三个分支树内都没有提交 localversion*/.scmversion
              DEFAULT_FULL="5.15.167"
              DEFAULT_SCM=""
              RELEASE_BASE="基于 Qualcomm kernel.lnx.5.15.c5 基底 + nubia 厂商层重建"
              ;;
            5.15.104)
              BRANCH="nx729j-5.15.104"; CONFIG_MODE="single"; KALAMA_CFG=""
              VERSION_TAG="5.15.104"; CCACHE_KEY="nx729j-gki-5.15.104"
              VER_PREFIX="5.15.104"
              DEFAULT_FULL="5.15.104"
              DEFAULT_SCM=""
              RELEASE_BASE="基于 AOSP ACK 5.15.104 (android13-5.15-2023-07_r3) 重建的 NX729J 树"
              ;;
            5.15.144)
              BRANCH="nx729j-5.15.144"; CONFIG_MODE="single"; KALAMA_CFG=""
              VERSION_TAG="5.15.144"; CCACHE_KEY="nx729j-gki-5.15.144"
              VER_PREFIX="5.15.144"
              DEFAULT_FULL="5.15.144"
              DEFAULT_SCM=""
              RELEASE_BASE="基于 AOSP ACK 5.15.144 重建的 NX729J 树"
              ;;
            *)
              BRANCH="main"; CONFIG_MODE="merge"; KALAMA_CFG="kalama_GKI.config"
              VERSION_TAG="5.15.41"; CCACHE_KEY="nx729j-gki-5.15.41"
              VER_PREFIX="5.15.41"
              DEFAULT_FULL="5.15.41"
              DEFAULT_SCM=""
              RELEASE_BASE="基于 nubia 官方 5.15.41 树 + nubia 厂商层"
              ;;
          esac
          echo "BRANCH=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "CONFIG_MODE=$CONFIG_MODE" >> "$GITHUB_OUTPUT"
          echo "KALAMA_CFG=$KALAMA_CFG" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "CCACHE_KEY=$CCACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "RELEASE_BASE=$RELEASE_BASE" >> "$GITHUB_OUTPUT"
          echo "=== 版本参数 ==="
          echo "  kernel_version = ${{ inputs.kernel_version }}"
          echo "  BRANCH         = $BRANCH"
          echo "  CONFIG_MODE    = $CONFIG_MODE"
          echo "  KALAMA_CFG     = ${KALAMA_CFG:-(single 模式不使用)}"
          # custom_version: 非空则覆盖完整版本串, 并剥离内核版本号前缀推导 .scmversion 后缀
          # (UTS_RELEASE = KERNELVERSION + CONFIG_LOCALVERSION + .scmversion,
          #  .scmversion 必须只含后缀, 否则版本串会重复拼接)
          CUSTOM="${{ inputs.custom_version }}"
          if [ -n "$CUSTOM" ]; then
            echo "VERSION_FULL=$CUSTOM" >> "$GITHUB_OUTPUT"
            if [[ "$CUSTOM" == "${VER_PREFIX}"* ]]; then
              SCM="${CUSTOM#"$VER_PREFIX"}"
              # 剥完还以版本号开头 ⇒ custom_version 自己就重复拼接了，
              # 再往下走会白编 25 分钟，这里直接掐掉
              if [[ "$SCM" == "${VER_PREFIX}"* ]]; then
                echo "::error::custom_version 自身重复拼接了内核版本号: $CUSTOM"
                exit 1
              fi
              echo "SCM_VER=$SCM" >> "$GITHUB_OUTPUT"
            else
              echo "!!! 警告: custom_version 不以 $VER_PREFIX 开头, SCM_VER 将用完整串(内核版本号会重复拼接, 非预期)" >&2
              echo "SCM_VER=$CUSTOM" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "VERSION_FULL=$DEFAULT_FULL" >> "$GITHUB_OUTPUT"
            echo "SCM_VER=$DEFAULT_SCM" >> "$GITHUB_OUTPUT"
          fi
          # 功能状态输出(供 release body 联动, true/false)
          echo "SUSFS=${{ inputs.enable_susfs }}" >> "$GITHUB_OUTPUT"
          echo "LZ4=${{ inputs.enable_lz4 }}" >> "$GITHUB_OUTPUT"
          echo "NETWORK=${{ inputs.enable_network }}" >> "$GITHUB_OUTPUT"
          echo "BBBRUTAL=${{ inputs.enable_bbbrutal }}" >> "$GITHUB_OUTPUT"
          echo "DROIDSPACES=${{ inputs.enable_droidspaces }}" >> "$GITHUB_OUTPUT"
          echo "BBG=${{ inputs.enable_bbg }}" >> "$GITHUB_OUTPUT"
          echo "EBPF=${{ inputs.enable_ebpf }}" >> "$GITHUB_OUTPUT"
          echo "CREATE_RELEASE=${{ inputs.create_release }}" >> "$GITHUB_OUTPUT"

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.BRANCH }}
          fetch-depth: 0

      - name: 记录产物对应的提交
        id: built
        run: |
          # ★ Release 的 tag 必须指向「产物对应的代码」。
          #   gh release create 不给 --target 时用的是仓库默认分支(main)，
          #   而 main 是导入树、根本不是这次编的代码 —— 历史那批 targetCommitish=main 就是这么来的。
          #   这里把 checkout 后的 HEAD 固化下来：即使编译期间 BRANCH 又前进，
          #   tag 也仍然精确指向「实际编译的那一笔」。
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "  产物对应提交: $SHA  (分支 ${{ steps.ver.outputs.BRANCH }})"

      - name: "版本串对齐 (写 .scmversion，custom_version 已推导好 SCM_VER)"
        if: ${{ steps.ver.outputs.SCM_VER != '' }}
        run: |
          echo "${{ steps.ver.outputs.SCM_VER }}" > .scmversion
          echo "已写入 .scmversion: $(cat .scmversion)"

      - name: 安装依赖 + 下载 AOSP clang
        run: |
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev bc dwarves ccache zip unzip
          # clang-r450784d = android13-5.15 时代 clang-14（与 build.config.constants 里 pin 的 r450784e 同族，
          # googlesource 上 r450784e 无 tag 可下，r450784d 确认可从 android-platform-13.0.0_r28 tag 下载）
          echo "正在下载 clang-${{ env.CLANG_VER }} ..."
          mkdir -p clang
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-13.0.0_r28/clang-${{ env.CLANG_VER }}.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz
          clang/bin/clang --version | head -n1
          clang/bin/ld.lld --version | head -n1
          pahole --version | head -n1 || true

      - name: 配置 ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=none" >> $GITHUB_ENV
          echo "CCACHE_NOHASHDIR=true" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache"
          ccache -M 3G
          ccache -o compression=true
          echo "ccache 初始状态:"; ccache -s

      - name: 载入 ccache 缓存
        uses: actions/cache@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ver.outputs.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ steps.ver.outputs.CCACHE_KEY }}-${{ runner.os }}-
            ${{ steps.ver.outputs.CCACHE_KEY }}-

      - name: 合并 defconfig (gki + kalama_* + NX729J-perf_diff) [仅 merge 模式]
        if: ${{ steps.ver.outputs.CONFIG_MODE == 'merge' }}
        run: |
          set -e
          echo "=== 使用 kalama 片段: ${{ steps.ver.outputs.KALAMA_CFG }} ==="
          echo "=== 说明: vendor/kalama-NX729J-gki_defconfig 是 ACK build 产物(.gitignore:164 忽略)，不在源码内，本步将生成它 ==="
          echo "=== 三合一 merge (与 build.config.msm.common 同参数 -m -r -y；bash 调用避开 Windows 提交丢失 exec bit) ==="
          KCONFIG_CONFIG=arch/arm64/configs/vendor/kalama-NX729J-gki_defconfig \
            bash scripts/kconfig/merge_config.sh -m -r -y \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/vendor/${{ steps.ver.outputs.KALAMA_CFG }} \
            arch/arm64/configs/vendor/NX729J-perf_diff.config

      - name: 校验合并结果 - 特性符号 (仅 5.15.41，已集成 KSU/droidspaces/网络)
        if: ${{ inputs.kernel_version == '5.15.41' }}
        run: |
          set -e
          echo "=== 合并后 defconfig 含 KSU/droidspaces ==="
          grep -E '^CONFIG_(KSU|SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|USER_NS|NETFILTER_XT_MATCH_ADDRTYPE|NETFILTER_XT_TARGET_LOG|NETFILTER_XT_MATCH_RECENT|TMPFS_POSIX_ACL|TMPFS_XATTR|IP_SET|IP_SET_HASH_IP|IP_SET_HASH_NET|NETFILTER_XT_SET)=' arch/arm64/configs/vendor/kalama-NX729J-gki_defconfig
          grep '^CONFIG_KSU=' arch/arm64/configs/vendor/kalama-NX729J-gki_defconfig

      - name: 校验合并结果 - 厂商符号 (仅 5.15.167)
        if: ${{ inputs.kernel_version == '5.15.167' }}
        run: |
          set -e
          echo "=== 合并后 defconfig 含 nubia 厂商层 + ARCH_KAKA ==="
          grep '^CONFIG_NUBIA_DRIVERS=' arch/arm64/configs/vendor/kalama-NX729J-gki_defconfig
          grep '^CONFIG_ARCH_KAKA=' arch/arm64/configs/vendor/kalama-NX729J-gki_defconfig

      - name: 生成 .config
        run: |
          set -e
          # Windows 提交丢失 exec bit，Linux checkout 上被直接执行的脚本(cc-version.sh/setlocalversion等)需恢复
          find scripts -type f -exec chmod +x {} +
          find . -path ./out -prune -o -path ./.git -prune -o -type f -name '*.sh' -exec chmod +x {} +
          export PATH="$PWD/clang/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache clang"
          # kbuild 的 %_defconfig 规则按 arch/arm64/configs/ 下的相对路径取文件名，
          # 所以 single 模式给 basename（nx729j_defconfig），不能给完整路径
          if [ "${{ steps.ver.outputs.CONFIG_MODE }}" = "single" ]; then
            TARGET=nx729j_defconfig
            echo "=== single 模式: 直接用仓库自带的 arch/arm64/configs/$TARGET ==="
          else
            TARGET=vendor/kalama-NX729J-gki_defconfig
            echo "=== merge 模式: 用上一步 merge_config.sh 生成的那份 ==="
          fi
          make -j$(nproc) O=out LLVM=1 ARCH=arm64 CC="$CC" LD=ld.lld OBJCOPY=llvm-objcopy "$TARGET"
          echo "=== .config 实际生效校验 ==="
          grep -E '^CONFIG_(BPF_SYSCALL|BPF_JIT|DEBUG_INFO_BTF|CC_IS_CLANG|CLANG_VERSION|WERROR|LTO_CLANG)=' out/.config
          grep '^CONFIG_KSU=' out/.config

      - name: 配置 .config (LTO/CFI 门禁 + 功能开关)
        run: |
          set -e
          export PATH="$PWD/clang/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 1) LTO/CFI 硬门禁 —— 绝不关闭 LTO。
          #    关掉 LTO 会连带关掉 CFI_CLANG：module_layout 等符号的 CRC 与手机固件不符，
          #    产物刷进去直接开不了机。所以这一步只校验、绝不修改配置。
          echo "=== LTO/CFI 门禁校验 ==="
          gate() {
            g_sym="$1"; g_want="$2"
            g_val=$(grep "^CONFIG_${g_sym}=" out/.config | head -1 || true)
            if [ "$g_want" = "y" ]; then
              if [ "$g_val" != "CONFIG_${g_sym}=y" ]; then
                echo "!! 期望 CONFIG_${g_sym}=y，实际: ${g_val:-未设置}"
                echo "!! 该产物会与手机固件 ABI 不符(刷入无法开机)，中止"
                exit 1
              fi
            else
              if [ -n "$g_val" ]; then
                echo "!! 不该出现 $g_val，中止"
                exit 1
              fi
            fi
            echo "  OK  CONFIG_${g_sym} 符合预期"
          }
          gate LTO_CLANG_FULL y
          gate CFI_CLANG y
          gate MODVERSIONS y
          gate LTO_NONE n
          gate LTO_CLANG_THIN n
          echo "=== 参考项(不强制，随各版本树能力) ==="
          grep -E '^CONFIG_(SHADOW_CALL_STACK|CFI_CLANG_SHADOW|CLANG_VERSION|LTO|LTO_CLANG)=' out/.config || true

          # 2) 功能开关: 按 enable_* input 累积要关闭的符号, 一次性 olddefconfig (依赖项自动清理)
          DISABLE=""
          if [ "${{ inputs.enable_susfs }}" = "false" ]; then DISABLE="$DISABLE KSU_SUSFS"; fi
          if [ "${{ inputs.enable_lz4 }}" = "false" ]; then DISABLE="$DISABLE ZRAM_DEF_COMP_LZ4"; fi
          if [ "${{ inputs.enable_network }}" = "false" ]; then DISABLE="$DISABLE IP_SET IP6_NF_NAT"; fi
          if [ "${{ inputs.enable_bbbrutal }}" = "false" ]; then DISABLE="$DISABLE TCP_CONG_BBR TCP_CONG_BRUTAL"; fi
          if [ "${{ inputs.enable_droidspaces }}" = "false" ]; then DISABLE="$DISABLE SYSVIPC POSIX_MQUEUE IPC_NS USER_NS"; fi
          if [ "${{ inputs.enable_bbg }}" = "false" ]; then DISABLE="$DISABLE BBG"; fi
          if [ "${{ inputs.enable_ebpf }}" = "false" ]; then DISABLE="$DISABLE BPF_SYSCALL BPF_JIT BPF_JIT_ALWAYS_ON DEBUG_INFO_BTF IKHEADERS"; fi
          if [ -n "$DISABLE" ]; then
            echo "=== 关闭开关符号:$DISABLE ==="
            for sym in $DISABLE; do
              ./scripts/config --file out/.config -d "$sym"
            done
            make O=out LLVM=1 ARCH=arm64 olddefconfig
          fi
          # BBG 关闭时同时从 LSM 列表移除 baseband_guard, 避免内核启动残留未知 LSM 警告
          # (BBG Makefile 硬校验仅在 BBG=y 时要求 LSM 含 baseband_guard, 关闭后无需)
          if [ "${{ inputs.enable_bbg }}" = "false" ]; then
            sed -i 's/baseband_guard,//g; s/,baseband_guard//g; s/baseband_guard//g' out/.config
            make O=out LLVM=1 ARCH=arm64 olddefconfig
          fi

          # 3) 打印各开关最终状态
          echo "=== 功能开关最终状态 ==="
          grep -E '^CONFIG_(KSU_SUSFS|ZRAM_DEF_COMP|ZRAM_DEF_COMP_LZ4|IP_SET|IP6_NF_NAT|TCP_CONG_BBR|TCP_CONG_BRUTAL|SYSVIPC|POSIX_MQUEUE|IPC_NS|USER_NS|BBG|BPF_SYSCALL|BPF_JIT|BPF_JIT_ALWAYS_ON|DEBUG_INFO_BTF|IKHEADERS)=' out/.config || true
          grep -E '^CONFIG_LSM=' out/.config || true

      - name: 准备 swap (FullLTO 链接内存峰值兜底)
        run: |
          set -e
          echo "=== swap 前 ==="; free -m; df -h /
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "根分区可用: ${avail}G"
          # FullLTO + CFI + DWARF 的 vmlinux 链接是单进程内存大户；仅靠 16G 物理内存会
          # 被外部 SIGTERM 掐掉（exit 143），所以补一块 swap 兜底。按剩余磁盘决定大小。
          SIZE=""
          if   [ "${avail:-0}" -ge 60 ]; then SIZE=24G
          elif [ "${avail:-0}" -ge 36 ]; then SIZE=16G
          elif [ "${avail:-0}" -ge 24 ]; then SIZE=8G
          fi
          if [ -z "$SIZE" ]; then
            echo "!! 磁盘不足 24G，跳过 swap（内存峰值风险自负）"; free -m; exit 0
          fi
          echo "选定 swap 大小: $SIZE"
          # 注意：runner 镜像自带的 swap 就在 /swapfile（只有 3G），与本步骤同路径。
          # 上一版写成「已存在 /swapfile 就跳过」，结果 16G 从未真正建立（实测日志：
          # 选定 16G -> 已存在 -> Swap 仍是 3071MB），等于没加。这里改为按大小比对，
          # 不够就先 swapoff 再重建。
          CUR=$(swapon --show=NAME,SIZE --noheadings 2>/dev/null | awk '$1=="/swapfile"{print $2; exit}')
          if [ -n "$CUR" ] && [ "${CUR%G}" -ge "${SIZE%G}" ] 2>/dev/null; then
            echo "现有 /swapfile 已是 $CUR >= $SIZE，无需重建"
          else
            echo "现有 /swapfile: ${CUR:-无} -> 重建为 $SIZE"
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo fallocate -l "$SIZE" /swapfile || \
              sudo dd if=/dev/zero of=/swapfile bs=1M count=$(( ${SIZE%G} * 1024 )) status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          # 让内核更早把冷页换出去，给单进程大分配让路（一次性 runner，无副作用）
          sudo sysctl -w vm.swappiness=100 || true
          echo "=== swap 后 ==="; free -m; swapon --show

      - name: 编译内核 Image
        run: |
          set -e
          export PATH="$PWD/clang/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache clang"
          echo "=== 资源状态(诊断) ==="
          free -m; df -h; nproc
          # 后台记录内存曲线：本步骤若被外部 SIGTERM 杀死(exit 143)，下面的 failure 分支
          # 根本不会执行，build.log 也不会被打印 —— 只能靠 mem.log 事后判断是不是内存打爆
          ( while true; do
              printf '%s ' "$(date -u +%H:%M:%S)"
              free -m | awk '/^Mem:/{printf "mem_used=%s mem_avail=%s ", $3, $7} /^Swap:/{printf "swap_used=%s swap_free=%s", $3, $4}'
              echo
              sleep 10
            done ) > mem.log 2>&1 &
          MEMLOG_PID=$!
          # 心跳直接打进 job 日志。实测发现：runner 被整个端掉时连 if: always() 的步骤
          # 都会被跳过，artifact 根本传不上去；只有已经流式发出去的日志行能活下来，
          # 所以「走到哪了 / 内存还剩多少」必须打到 stdout 上。
          ( while true; do
              sleep 30
              echo "[hb $(date -u +%H:%M:%S)] $(free -m | awk '/^Mem:/{printf "mem_avail=%sM", $7} /^Swap:/{printf " swap_free=%sM", $4}') | build.log $(wc -l < build.log 2>/dev/null || echo 0) 行 | 最后: $(tail -1 build.log 2>/dev/null | cut -c1-90)"
            done ) &
          HB_PID=$!
          # 去除 -dirty 后缀(编译期 merge 会改动检入的 defconfig 导致 git 树变脏；
          # 四个版本现在都走 git 派生，所以这条 sed 每个版本都需要)
          sed -i 's/ -dirty//g' scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' scripts/setlocalversion
          echo "=== 编译内核(输出重定向 build.log, 仅失败时显示尾部) ==="
          set +e
          make -j$(nproc) O=out LLVM=1 ARCH=arm64 CC="$CC" LD=ld.lld OBJCOPY=llvm-objcopy Image > build.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== 编译失败 (exit $rc)，build.log 尾部: ==="
            tail -80 build.log
            echo "=== 失败前内存曲线尾部 ==="
            tail -15 mem.log || true
            exit $rc
          fi
          kill "$MEMLOG_PID" "$HB_PID" 2>/dev/null || true
          echo "=== 编译期间内存曲线尾部 ==="
          tail -8 mem.log || true
          echo "=== 编译产物 ==="
          ls -lh out/arch/arm64/boot/Image
          echo "=== 版本串校验(默认 git 派生串；custom_version 时另加精确比对) ==="
          # 不能用 grep 做「子串搜索」当校验：重复拼接出来的
          #   5.15.1675.15.167-android13-...
          # 里照样含有 5.15.167-android13-...，子串匹配会照常命中，什么都挡不住。
          # ★ 抽取必须带 [0-9] 锚点：Image 里另有一条更靠前的格式串
          #   "Linux version %s (%s)"（偏移约 33.2M），真 banner 在其后（约 36.1M）。
          #   不带锚点会被诱饵抢先命中，抽出字面量 "%s" 而误判失败。
          # 取最长匹配，与下面 Release step 同口径，再多诱饵也不会选错。
          VER_ACTUAL=$(strings -a out/arch/arm64/boot/Image \
            | grep -oE 'Linux version [0-9][^ ]*' \
            | sed 's/^Linux version //' \
            | sort -u | awk 'length > m { m = length; b = $0 } END { print b }')
          if [ -z "$VER_ACTUAL" ]; then
            echo "::error::Image 里没找到 'Linux version <版本号>' 串(抽取结果为空)"
            exit 1
          fi
          echo "  实际: $VER_ACTUAL"
          echo "  期望: ${{ steps.ver.outputs.VERSION_FULL }}"
          KTAG="${{ steps.ver.outputs.VERSION_TAG }}"
          N_TAG=$(printf '%s' "$VER_ACTUAL" | grep -oF "$KTAG" | wc -l)
          if [ "$N_TAG" -ne 1 ]; then
            echo "::error::内核版本号 $KTAG 在版本串里出现 $N_TAG 次(应为 1 次): $VER_ACTUAL"
            echo "::error::出现 0 次 ⇒ 抽取抓错了串；出现 2 次 ⇒ .scmversion 里放了完整串，它只能放后缀 (UTS_RELEASE = KERNELVERSION + LOCALVERSION + .scmversion)"
            exit 1
          fi
          if [ -n "${{ steps.ver.outputs.SCM_VER }}" ] && [ "$VER_ACTUAL" != "${{ steps.ver.outputs.VERSION_FULL }}" ]; then
            echo "::error::版本串不符: 实际 '$VER_ACTUAL' ≠ 期望 '${{ steps.ver.outputs.VERSION_FULL }}'"
            exit 1
          fi
          echo "  ✓ $VER_ACTUAL  (内核版本号恰好出现 1 次)"
          cp out/.config ./compiled.config
          echo "ccache 状态:"; ccache -s

      - name: 上传诊断日志 (无论成败)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ steps.ver.outputs.VERSION_TAG }}-${{ github.run_id }}
          path: |
            build.log
            mem.log
            compiled.config
          if-no-files-found: ignore
          retention-days: 7

      - name: 保存 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ver.outputs.CCACHE_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 打包 AnyKernel3 刷机包
        if: inputs.package_ak3
        id: create_zip
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel3
          rm -rf anykernel3/.git
          cd anykernel3
          cp ../out/arch/arm64/boot/Image ./Image
          if [[ ! -s ./Image ]]; then echo "未找到 Image，构建可能出错"; exit 1; fi
          # ★ 不再用 sed 去猜上游模板：上游 anykernel.sh 的措辞一变，sed 就静默不命中。
          #   实例(2026-10-01)：上游模板里 IS_SLOT_DEVICE 是 0，而 ak3-core.sh 的 slot 判定是
          #     case $IS_SLOT_DEVICE in 1|auto)   # slot detection enabled by ...
          #   0 一个分支都不匹配 ⇒ SLOT 为空 ⇒ 找分区的循环 `for part in $name$SLOT $name`
          #   只试 boot、永远试不到 boot_a/boot_b ⇒ 本机(A/B，by-name 下只有 boot_a/boot_b)
          #   在 ak3-core.sh:994 处 abort "Unable to determine boot partition"。
          #   故改成把「已在设备上刷成功过的那份」写死在这里，并对关键行加断言。
          cat > anykernel.sh <<'AK3CONF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=RedMagic8SPro-GKI
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          device.name2=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties


          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot; # GKI 2.0: ramdisk 在 init_boot, boot 仅内核 -> 跳过 ramdisk 解包
          flash_boot; # 仅替换内核, 跳过 ramdisk 重打包
          ## end boot install
          AK3CONF
          # 断言：这份文件被误改就直接失败，不要等刷机时才发现
          grep -qx 'IS_SLOT_DEVICE=auto;' anykernel.sh || { echo "::error::anykernel.sh 的 IS_SLOT_DEVICE 不是 auto —— 为 0 会跳过 slot 判定，A/B 机找不到 boot_b"; exit 1; }
          grep -q '^BLOCK=boot;' anykernel.sh || { echo "::error::anykernel.sh 的 BLOCK 不是 boot"; exit 1; }
          grep -q '^split_boot;' anykernel.sh || { echo "::error::anykernel.sh 缺 split_boot —— GKI 2.0 的 ramdisk 在 init_boot，不该解包"; exit 1; }
          grep -q '^flash_boot;' anykernel.sh || { echo "::error::anykernel.sh 缺 flash_boot —— 会退回到重打包 ramdisk"; exit 1; }
          grep -q '^do.devicecheck=0' anykernel.sh || { echo "::error::anykernel.sh 的 do.devicecheck 不为 0"; exit 1; }
          ! grep -q 'tuna' anykernel.sh || { echo "::error::anykernel.sh 里混进了上游的 tuna(Galaxy Nexus) 打补丁段"; exit 1; }
          # 包名用「从 Image 里实际抽出的版本串」而不是 VERSION_FULL：默认值只到 5.15.x，
          # 不含提交号，会让文件名与 release 标题(用的是实际串)对不上、也认不出是哪次构建。
          # (grep 无匹配时 pipefail 会让赋值直接失败，这里 || true 兜底，改用下面显式判空)
          VER_ACTUAL=$(strings -a ./Image | grep -oE '5\.15\.[0-9]+(-[A-Za-z0-9._-]+)?' | sort -u | awk 'length > max { max = length; best = $0 } END { print best }' || true)
          if [ -z "$VER_ACTUAL" ]; then
            echo "::error::从 Image 抽不到版本串（正常应在编译后的校验步骤就被拦下），拒绝用占位名打包"
            exit 1
          fi
          echo "  Image 实际版本串: $VER_ACTUAL"
          AK3_NAME="AnyKernel3-NX729J-$VER_ACTUAL-ReSukiSU.zip"
          zip -r9 "../$AK3_NAME" ./* -x '*.git*'
          echo "ak3name=$AK3_NAME" >> "$GITHUB_OUTPUT"
          echo "=== 刷机包已生成: $AK3_NAME ==="

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: NX729J-GKI-${{ steps.ver.outputs.VERSION_TAG }}
          path: |
            out/arch/arm64/boot/Image
            compiled.config
            AnyKernel3-NX729J-*.zip
          retention-days: 14

      - name: 发布 GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 从 Image 提取实际版本串(最长匹配 = UTS_RELEASE，兼容 custom_version / 5.15.41 的 -g<hash> 形式)
          VER_ACTUAL=$(strings -a out/arch/arm64/boot/Image | grep -oE '5\.15\.[0-9]+(-[A-Za-z0-9._-]+)?' | sort -u | awk 'length > max { max = length; best = $0 } END { print best }')
          [ -n "$VER_ACTUAL" ] || VER_ACTUAL="${{ steps.ver.outputs.VERSION_FULL }}"
          TAG="NX729J-build-$(TZ=Asia/Shanghai date +%y%m%d%H%M)"
          cat > release_body.md <<EOF
          ### 📱 红魔8S Pro (NX729J) ReSukiSU 通用内核 | 构建信息

          * 内核版本号: ${VER_ACTUAL}
          * 编译时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') (CST)
          * 机型：红魔8S Pro (NX729J) 通用 ${{ steps.ver.outputs.VERSION_TAG }} GKI 2.0 内核（${{ steps.ver.outputs.RELEASE_BASE }}）
          * KSU分支：ReSukiSU
          * susfs支持：${{ steps.ver.outputs.SUSFS }}
          * LZ4支持：${{ steps.ver.outputs.LZ4 }}
          * 网络功能增强：${{ steps.ver.outputs.NETWORK }}
          * BBR/Brutal 等拥塞控制算法支持：${{ steps.ver.outputs.BBBRUTAL }}
          * Droidspaces 容器支持：${{ steps.ver.outputs.DROIDSPACES }}
          * 内核级基带保护支持：${{ steps.ver.outputs.BBG }}
          * eBPF支持（daed 所需 BPF/JIT/BTF/IKHEADERS）：${{ steps.ver.outputs.EBPF }}
          * ReSukiSU管理器下载：[ReSukiSU_CI](https://github.com/cctv18/ReSukiSU_CI/releases)

          #### ※※※ 刷写内核有风险，可能导致无法开机、WIFI/指纹/基带异常等。刷写前务必备份 boot 分区（TWRP 或 Android 工具箱）。刷入后如遇问题请回刷官方 boot.img。※※※
          EOF
          # ★ --target 必须显式给：不给时 gh 用仓库默认分支(main)建 tag，
          #   而 main 是导入树、不是这次编的代码 —— tag 里的代码与产物对不上。
          #   优先用「实际编译的那一笔」，退化才用产物分支；两者皆空宁可失败也别发错。
          TARGET="${{ steps.built.outputs.sha }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ steps.ver.outputs.BRANCH }}"
            echo "::warning::拿不到产物提交 sha，回退用分支名做 --target: $TARGET"
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::产物提交 sha 与分支名都为空，拒绝发布(否则 tag 会落到默认分支 main)"
            exit 1
          fi
          echo "=== 发布 Release: $TAG  (--target $TARGET) ==="
          if ls AnyKernel3-NX729J-*.zip >/dev/null 2>&1; then
            gh release create "$TAG" AnyKernel3-NX729J-*.zip --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "NX729J-build-$VER_ACTUAL" --notes-file release_body.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "NX729J-build-$VER_ACTUAL" --notes-file release_body.md
          fi
          echo "=== 已发布: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG ==="

          # 发布后验证 tag 真指向产物对应的提交(与手工发布的验证判据一致)。
          # 只告警不失败：Release 已经发出去了，这里再让 job 变红没有意义。
          BUILT_SHA="${{ steps.built.outputs.sha }}"
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null || true)
          echo "  核实: tag $TAG -> ${TAG_SHA:-（取不到）}"
          if [ -n "$BUILT_SHA" ] && [ "$TAG_SHA" != "$BUILT_SHA" ]; then
            echo "::warning::tag 实际指向 ${TAG_SHA:-空}，与产物提交 $BUILT_SHA 不一致"
          fi
